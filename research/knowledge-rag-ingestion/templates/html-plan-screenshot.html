<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 30px;
}
.card {
  width: 780px;
  max-width: 100%;
  background: rgba(30, 41, 59, 0.85);
  border-radius: 24px;
  padding: 35px;
  border: 1px solid rgba(255, 215, 0, 0.15);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 {
  font-size: 26px; font-weight: 700;
  color: #ffd700; margin-bottom: 4px;
}
.subtitle { color: #64748b; font-size: 14px; margin-bottom: 16px; }
.divider {
  height: 2px;
  background: linear-gradient(90deg, #ffd700 30%, rgba(255,215,0,0.1));
  margin-bottom: 20px;
}
h2 { color: #fff; font-size: 16px; margin-bottom: 12px; }
/* Card for each item/proposal */
.proposal {
  background: rgba(15,23,42,0.6);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 12px;
  border-left: 6px solid;
}
.proposal.gold { border-left-color: #ffd700; }
.proposal.green { border-left-color: #2ecc71; }
.proposal.blue { border-left-color: #3498db; }
.proposal.red { border-left-color: #e74c3c; }
.proposal.purple { border-left-color: #9b59b6; }
.prop-title { color: #fff; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.prop-desc { color: #94a3b8; font-size: 13px; line-height: 1.7; }
/* Stats table */
.stats { width: 100%; border-collapse: collapse; margin: 12px 0; }
.stats th { text-align: left; color: #ffd700; font-size: 13px; padding: 6px 10px; border-bottom: 1px solid rgba(255,215,0,0.2); }
.stats td { color: #94a3b8; font-size: 13px; padding: 6px 10px; border-bottom: 1px solid rgba(100,116,139,0.15); }
.stat-val { color: #2ecc71; font-weight: 600; }
/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-right: 4px; margin-top: 4px; }
.tag-red { background: rgba(231,76,60,0.2); color: #e74c3c; }
.tag-green { background: rgba(46,204,113,0.2); color: #2ecc71; }
.tag-blue { background: rgba(52,152,219,0.2); color: #3498db; }
.tag-yellow { background: rgba(255,215,0,0.2); color: #ffd700; }
/* Callout */
.callout {
  background: rgba(255,215,0,0.04);
  border-radius: 12px; padding: 14px 18px;
  margin: 12px 0;
  color: #cbd5e1; font-size: 13px; line-height: 1.8;
}
.callout strong { color: #ffd700; }
/* Code / monospace block */
.code-block {
  background: rgba(15,23,42,0.8);
  border-radius: 10px; padding: 14px 16px;
  font-family: monospace; font-size: 13px;
  color: #cbd5e1; line-height: 1.7;
  margin: 10px 0;
  white-space: pre-wrap;
}
/* Architecture diagram */
.arch-flow {
  display: flex; justify-content: space-between;
  align-items: center; margin: 18px 0; gap: 8px;
}
.arch-box {
  background: rgba(15,23,42,0.7);
  border-radius: 12px; padding: 14px 12px;
  text-align: center; flex: 1;
  border: 1px solid rgba(100,116,139,0.3);
}
.arch-icon { font-size: 28px; margin-bottom: 4px; }
.arch-label { color: #94a3b8; font-size: 12px; }
.arch-arrow { color: #ffd700; font-size: 20px; }
.footer { text-align: center; margin-top: 24px; font-size: 12px; color: #334155; }
</style></head>
<body>
<div class="card">
<h1>[TITLE] 方案标题</h1>
<div class="subtitle">副标题 / 说明</div>
<div class="divider"></div>

<!-- Content goes here: use proposal cards, tables, callouts, arch-flow -->

<div class="footer">数据来源: xxx · 生成于 {{date}}</div>
</div>
</body>
</html>
